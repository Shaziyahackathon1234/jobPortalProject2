server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: unknown paths are handled by the app, not by nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets for a long time
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
