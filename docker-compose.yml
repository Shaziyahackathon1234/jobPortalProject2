# Runs the whole project with one command:  docker compose up --build
# Three containers on one private network: mongo, backend, frontend.
# Containers reach each other by service name (backend talks to "mongo", not localhost).

services:
  mongo:
    image: mongo:7
    container_name: jobportal-mongo
    ports:
      - "27017:27017"          # optional: lets Compass on your Mac connect
    volumes:
      - mongo_data:/data/db    # data survives "docker compose down"

  backend:
    build: ./backend
    container_name: jobportal-backend
    env_file:
      - ./backend/.env         # SECRET_KEY, GROQ_API_KEY, CLOUDINARY_*, LOGODEV_TOKEN
    environment:
      PORT: 8000
      # Overrides MONGO_URI from .env so the API uses the local mongo container.
      # Delete this line to use your Atlas cluster instead.
      MONGO_URI: mongodb://mongo:27017/jobportal
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API from YOUR machine, so this stays localhost:8000
        VITE_API_URL: http://localhost:8000/api/v1
    container_name: jobportal-frontend
    ports:
      - "5173:80"              # open http://localhost:5173
    depends_on:
      - backend

volumes:
  mongo_data:
